name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pip-audit
      # Sem o banco (fora do Git), os testes da API e das eras reais são pulados; os do simulador usam dados fabricados.
      - run: python -m pytest tests -rs
      - name: Dependências com vulnerabilidade conhecida
        run: pip-audit -r requirements.txt

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Dependências com vulnerabilidade conhecida
        run: npm audit --audit-level=high
